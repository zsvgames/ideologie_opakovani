<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kvíz: Politické ideologie 🎯</title>
<style>
  :root{
    --bg:#0d1020;--card:rgba(28,32,54,.92);--border:rgba(255,255,255,.09);
    --muted:#9da6bd;--text:#e8ebf4;
    --primary:#7c6cff;--green:#2bb673;--peach:#ff9f68;--redSoft:#ff6b6b;
    --lib:#4f8cff;--con:#ffb84d;--soc:#ff6b6b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Outfit',system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:#0f1117;
    background-image:
      radial-gradient(640px 480px at 10% 10%, rgba(88,101,242,.14), transparent 62%),
      radial-gradient(720px 520px at 94% 16%, rgba(168,85,247,.12), transparent 62%),
      radial-gradient(620px 480px at 50% 110%, rgba(14,169,113,.10), transparent 62%);
  }
  .container{
    width:100%;max-width:720px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    overflow:hidden;
  }
  /* ===== Header ===== */
  .header{
    padding:24px 32px;
    background:rgba(0,0,0,.15);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .header h1{
    font-size:2.2rem;font-weight:700;
    color:#FFFFFF;
  }
  .header-badges{
    display:flex;align-items:center;gap:10px;
    position:relative;
  }
  .score-badge{
    background:#1E293B;
    border:1px solid var(--border);
    padding:6px 16px;border-radius:20px;
    font-size:.9rem;font-weight:600;
    color:#F59E0B;
    position:relative;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .score-badge.bump{
    transform:scale(1.14);
  }
  .streak-badge .flame{
    display:inline-block;
    animation:flameFlicker 1.1s ease-in-out infinite;
  }
  @keyframes flameFlicker{
    0%,100%{transform:scale(1) rotate(-2deg);}
    50%{transform:scale(1.15) rotate(2deg);}
  }
  .points-popup{
    position:absolute;
    right:0;top:50%;
    font-weight:800;font-size:1.05rem;
    pointer-events:none;
    white-space:nowrap;
    animation:pointsFloat 1s ease-out forwards;
  }
  .points-popup.good{color:var(--green);}
  .points-popup.bonus{color:var(--peach);}
  @keyframes pointsFloat{
    0%{opacity:0;transform:translate(0,-50%) translateY(6px);}
    15%{opacity:1;transform:translate(0,-50%) translateY(-4px);}
    75%{opacity:1;transform:translate(0,-50%) translateY(-30px);}
    100%{opacity:0;transform:translate(0,-50%) translateY(-42px);}
  }
  .streak-toast{
    position:fixed;left:50%;top:18px;
    transform:translate(-50%,-220%);
    opacity:0;
    background:linear-gradient(135deg,var(--peach),#ff7e4d);
    color:#2a1608;font-weight:800;font-size:.95rem;
    padding:10px 22px;border-radius:30px;
    box-shadow:0 10px 30px rgba(255,159,104,.4);
    z-index:50;
    pointer-events:none;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    display:flex;align-items:center;gap:6px;
  }
  .streak-toast.show{
    transform:translate(-50%,0);
    opacity:1;
  }
  /* ===== Start Screen ===== */
  .start-screen{
    text-align:center;
    padding:56px 32px 52px;
    position:relative;
    overflow:hidden;
  }
  .bg-shapes{
    position:absolute;inset:0;
    pointer-events:none;z-index:0;
  }
  .bg-shape{
    position:absolute;border-radius:50%;
    filter:blur(2px);
    opacity:.55;
  }
  .bg-shape.s1{
    width:120px;height:120px;top:-30px;left:-20px;
    background:radial-gradient(circle at 35% 35%, rgba(124,108,255,.9), rgba(124,108,255,0) 70%);
    animation:drift1 9s ease-in-out infinite;
  }
  .bg-shape.s2{
    width:70px;height:70px;top:20px;right:8%;
    background:radial-gradient(circle at 35% 35%, rgba(255,184,77,.85), rgba(255,184,77,0) 70%);
    animation:drift2 7s ease-in-out infinite;
  }
  .bg-shape.s3{
    width:150px;height:150px;bottom:-50px;right:-40px;
    background:radial-gradient(circle at 35% 35%, rgba(255,107,107,.75), rgba(255,107,107,0) 70%);
    animation:drift3 12s ease-in-out infinite;
  }
  .bg-shape.s4{
    width:46px;height:46px;bottom:18%;left:6%;
    background:radial-gradient(circle at 35% 35%, rgba(43,182,115,.85), rgba(43,182,115,0) 70%);
    animation:drift4 8s ease-in-out infinite;
  }
  .bg-shape.s5{
    width:90px;height:90px;top:45%;left:-30px;
    background:radial-gradient(circle at 35% 35%, rgba(167,128,255,.7), rgba(167,128,255,0) 70%);
    animation:drift2 10s ease-in-out infinite reverse;
  }
  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(18px,26px) scale(1.12);}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-16px,20px) scale(.9);}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-22px,-18px) scale(1.08);}
  }
  @keyframes drift4{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(14px,-16px) scale(1.15);}
  }
  .start-content{position:relative;z-index:1;}
  .hero-icon-box{
    margin:0 auto 24px;
  }
  .hero-icon-box .quiz-icon{
    font-size:3.1rem;
    filter:drop-shadow(0 0 16px rgba(124,108,255,.85));
    display:inline-block;
  }
  .start-screen .subtitle{
    color:var(--text);font-size:1.35rem;font-weight:700;
    line-height:1.45;max-width:460px;letter-spacing:-.01em;
    margin:0 auto 34px;
  }
  .btn{
    background:var(--primary);color:#fff;
    border:none;border-radius:12px;
    padding:14px 32px;font-size:1.05rem;font-weight:600;
    cursor:pointer;transition:all .25s ease;
    display:inline-flex;align-items:center;gap:8px;
    box-shadow:0 0 15px rgba(124,108,255,.5);
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 25px rgba(124,108,255,.7);
  }
  .btn-start{
    font-size:1.1rem;padding:16px 44px;
    border-radius:14px;
    position:relative;
    background:linear-gradient(135deg,var(--primary),#a780ff);
    box-shadow:0 0 22px rgba(124,108,255,.5);
  }
  .btn-start::before{
    content:'';
    position:absolute;inset:-4px;
    border-radius:18px;z-index:-1;
    border:3px solid var(--primary);
    filter:blur(4px);
    animation:edgePulse 2.2s ease-in-out infinite;
  }
  .btn-start:hover{
    box-shadow:0 0 34px rgba(124,108,255,.8);
  }
  @keyframes edgePulse{
    0%,100%{opacity:.35;transform:scale(1);}
    50%{opacity:1;transform:scale(1.055);}
  }
  .btn-secondary{
    background:transparent;color:var(--text);
    border:1px solid var(--border);
  }
  .btn-secondary:hover{
    background:rgba(255,255,255,.05);
    box-shadow:0 8px 24px rgba(0,0,0,.2);
  }
  /* ===== Quiz Screen ===== */
  .quiz-screen{padding:32px;}
  .progress-wrap{margin-bottom:24px;}
  .progress-label{
    text-align:right;font-size:.8rem;color:#94A3B8;
    margin-bottom:6px;font-weight:600;
  }
  .progress-bar{
    height:8px;width:100%;background:var(--border);
    border-radius:4px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:#FFFFFF;
    border-radius:4px;transition:width .4s ease;
  }
  .question-text{
    font-size:1.35rem;font-weight:600;
    margin-bottom:24px;line-height:1.4;
  }
  .answers{
    display:grid;gap:12px;
  }
  .answer-btn{
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    border-radius:12px;padding:16px 20px;
    font-size:1rem;text-align:left;cursor:pointer;
    transition:all .2s ease;
    display:flex;align-items:center;gap:12px;
    color:var(--text);
    font-family:inherit;
  }
  .answer-btn:hover{
    background:rgba(255,255,255,.06);
    border-color:rgba(124,108,255,.3);
  }
  .answer-btn.correct{
    background:rgba(16,185,129,.1);
    border-color:#10B981;
  }
  .answer-btn.wrong{
    background:rgba(255,107,107,.15);
    border-color:var(--redSoft);
  }
  .answer-btn:disabled{
    cursor:not-allowed;
  }
  .answer-letter{
    width:32px;height:32px;border-radius:50%;
    background:rgba(124,108,255,.15);
    display:flex;align-items:center;
    justify-content:center;font-weight:700;
    color:var(--primary);flex-shrink:0;
  }
  .answer-btn.correct .answer-letter{
    background:#10B981;color:#fff;
  }
  .answer-btn.wrong .answer-letter{
    background:var(--redSoft);color:#fff;
  }
  
  .feedback-box{
    margin-top:16px;padding:16px 20px;border-radius:12px;
    background:rgba(255,255,255,.03);
    border:1px solid var(--border);
    animation:feedbackIn .25s ease;
  }
  @keyframes feedbackIn{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }
  .feedback-verdict{
    font-weight:700;font-size:1.05rem;margin-bottom:8px;
  }
  .feedback-verdict.is-correct{color:var(--green);}
  .feedback-verdict.is-wrong{color:var(--redSoft);}
  .feedback-world{
    font-size:.92rem;color:#94A3B8;line-height:1.5;margin-bottom:14px;
  }
  .feedback-world strong{color:var(--text);}
  .continue-btn{
    width:100%;justify-content:center;
    background:#2563EB;
    box-shadow:0 0 15px rgba(37,99,235,.4);
  }
  .continue-btn:hover{
    background:#1d4ed8;
    box-shadow:0 0 22px rgba(37,99,235,.55);
  }
  .diagnostic-box{
    margin:20px auto 0;max-width:480px;
    padding:16px 20px;border-radius:12px;text-align:left;
    background:rgba(124,108,255,.1);
    border:1px solid rgba(124,108,255,.3);
    font-size:.92rem;line-height:1.55;color:#cfc9ff;
  }
  .diagnostic-box strong{color:#b9adff;}
  /* ===== Results Screen ===== */
  .results-screen{text-align:center;padding:50px 32px;}
  .results-screen h2{font-size:2rem;margin-bottom:12px;}
  .final-score{
    font-size:3.5rem;font-weight:800;
    background:linear-gradient(135deg,var(--primary),#a780ff);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin:16px 0;
  }
  .score-detail{
    color:var(--muted);font-size:1.05rem;
    margin-bottom:28px;line-height:1.6;
  }
  .record-badge{
    display:inline-block;
    background:linear-gradient(135deg,var(--peach),#ffad68);
    color:#1a1a2e;font-weight:700;
    padding:8px 20px;border-radius:20px;
    font-size:.9rem;margin-bottom:24px;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(255,159,104,.4);}
    50%{box-shadow:0 0 0 10px rgba(255,159,104,0);}
  }
  /* ===== Exit Ticket ===== */
  .exit-ticket{
    background:rgba(28,32,54,.96);
    border:1px solid var(--border);
    border-radius:16px;padding:28px;
    margin-top:24px;text-align:left;
  }
  .exit-ticket h3{
    font-size:1.2rem;margin-bottom:16px;
    text-align:center;
  }
  .rating{
    display:flex;justify-content:center;
    gap:10px;margin-bottom:16px;
  }
  .rating input{display:none;}
  .rating label{
    width:44px;height:44px;border-radius:50%;
    background:rgba(124,108,255,.1);
    border:2px solid var(--border);
    display:flex;align-items:center;
    justify-content:center;cursor:pointer;
    font-size:1.1rem;font-weight:600;
    color:var(--muted);transition:all .2s;
  }
  .rating input:checked + label{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
  }
  .exit-ticket textarea{
    width:100%;min-height:100px;
    background:rgba(0,0,0,.1);
    border:1px solid var(--border);
    border-radius:10px;padding:12px;
    color:var(--text);font-family:inherit;
    font-size:.95rem;resize:vertical;
    margin-bottom:16px;
  }
  .exit-ticket textarea::placeholder{
    color:var(--muted);
  }
  .submit-exit{
    width:100%;
  }
  /* ===== High Score ===== */
  .high-score{
    background:rgba(42,182,115,.1);
    border:1px solid var(--green);
    border-radius:12px;padding:16px;
    text-align:center;margin-top:16px;
  }
  .high-score .label{
    font-size:.85rem;color:var(--muted);
  }
  .high-score .value{
    font-size:1.5rem;font-weight:700;
    color:var(--green);
  }
  /* ===== Particles ===== */
  .particles{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;z-index:-1;
  }
  .particle{
    position:absolute;
    background:rgba(124,108,255,.15);
    border-radius:50%;
  }
  @media(max-width:600px){
    .header{padding:16px 20px;}
    .quiz-screen{padding:20px;}
    .question-text{font-size:1.2rem;}
    .start-screen{padding:30px 20px 36px;}
    .start-screen .subtitle{font-size:1.1rem;}
    .bg-shape{filter:blur(1.5px);}
    .bg-shape.s1{width:80px;height:80px;}
    .bg-shape.s3{width:100px;height:100px;}
  }
</style>
</head>
<body>
<div class="container">
  <!-- ===== Header ===== -->
  <div class="header" style="display:none">
    <h1>Kvíz Ideologie</h1>
    <div class="header-badges">
      <div id="scoreBadge" class="score-badge">Body: <span id="currentScore">0</span>
        <div id="pointsPopupHost"></div>
      </div>
    </div>
  </div>
  <div id="streakToast" class="streak-toast"><span class="flame">🔥</span> <span id="streakToastText">Série 3!</span></div>

  <!-- ===== Start Screen ===== -->
  <div id="startScreen" class="start-screen">
    <div class="bg-shapes">
      <div class="bg-shape s1"></div>
      <div class="bg-shape s2"></div>
      <div class="bg-shape s3"></div>
      <div class="bg-shape s4"></div>
      <div class="bg-shape s5"></div>
    </div>
    <div class="start-content">
      <div class="hero-icon-box">
        <div class="quiz-icon">⚖️</div>
      </div>
      <p class="subtitle">Otestuj si, jak dobře rozlišuješ mezi liberalismem, konzervatismem a socialismem.</p>

      <button id="startBtn" class="btn btn-start">Spustit kvíz →</button>
    </div>
  </div>

  <!-- ===== Quiz Screen ===== -->
  <div id="quizScreen" class="quiz-screen" style="display:none;">
    <div class="progress-wrap">
      <div id="progressLabel" class="progress-label">1 z 20</div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <div id="questionText" class="question-text">Otázka se načítá…</div>
    <div id="answers" class="answers"></div>
    <div id="feedbackBox" class="feedback-box" style="display:none;">
      <div id="feedbackVerdict" class="feedback-verdict"></div>
      <div id="feedbackWorld" class="feedback-world"></div>
      <button id="continueBtn" class="btn continue-btn">Pokračovat →</button>
    </div>
  </div>

  <!-- ===== Results Screen ===== -->
  <div id="resultsScreen" class="results-screen" style="display:none;">
    <h2>Výsledky kvízu 🏁</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="score-detail" id="scoreDetail"></div>
    <div id="diagnosticBox" class="diagnostic-box"></div>
    <div id="recordBadge" style="display:none;">
      <span class="record-badge">🎉 Nový rekord!</span>
    </div>
    <div id="highScoreDisplay" class="high-score" style="display:none;">
      <div class="label">Dosavadní nejlepší skóre</div>
      <div class="value" id="bestScoreValue">0</div>
    </div>
    <div style="margin-top:24px">
      <button id="restartBtn" class="btn">Znovu hrát</button>
    </div>

    <!-- ===== Exit Ticket ===== -->
    <div class="exit-ticket">
      <h3>📝 Exit ticket — Reflexe</h3>
      <p style="color:var(--muted);font-size:.9rem;margin-bottom:12px">
        Ohodnoť (1 = není jasné · 5 = rozumím).
      </p>
      <div class="rating">
        <input type="radio" id="rating1" name="rating" value="1">
        <label for="rating1">1</label>
        <input type="radio" id="rating2" name="rating" value="2">
        <label for="rating2">2</label>
        <input type="radio" id="rating3" name="rating" value="3">
        <label for="rating3">3</label>
        <input type="radio" id="rating4" name="rating" value="4">
        <label for="rating4">4</label>
        <input type="radio" id="rating5" name="rating" value="5">
        <label for="rating5">5</label>
      </div>
      <textarea id="exitComment" placeholder="Napiš, co tě zajímalo nebo co jsi nepochopil/a…"></textarea>
      <button id="submitExit" class="btn submit-exit">Odeslat exit ticket</button>
    </div>
  </div>

  </div>

<script>
/* ===== Data: otázky o politických ideologiích ===== */
const questions = [
  {
    question: "Který politický směr razí heslo: „Každý svého štěstí strůjce“?",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 0,
    explanation: "Svoboda a vlastní odpovědnost nade vše.",
    today: "📍 **2022 Švýcarsko:** V referendu 25. září (těsných 50,6 % hlasů) občané schválili reformu AHV 21, která sjednotila důchodový věk žen na 65 let (dříve 64) — stát tak přenesl část zodpovědnosti za vlastní stáří zpět na jednotlivce místo dalšího prohlubování dluhu penzijního systému."
  },
  {
    question: "Pro kterou ideologii je jednou z hlavních hodnot tradiční rodina?",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 1,
    explanation: "Tradiční rodina jako pilíř společnosti.",
    today: "📍 **2011 Maďarsko:** Článek L nové Ústavy explicitně definoval manželství jako svazek muže a ženy. V návaznosti na to byl zaveden zákon o daňových úlevách, který rodinám se 3 a více dětmi plošně snížil daň z příjmu o více než 60 %."
  },
  {
    question: "Který směr klade největší důraz na rovnost mezi lidmi a solidaritu?",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 2,
    explanation: "Rovnost a solidarita především.",
    today: "📍 **1995 Švédsko:** Novela zákona o rodičovském pojištění zavedla tzv. „pappamånad“ — jeden měsíc rodičovské dovolené vyhrazený výhradně otci, který propadá, pokud si ho nevybere. Rodina tak o něj nemůže přijít ve prospěch druhého rodiče, což mělo vyrovnat podíl mužů na péči o děti."
  },
  {
    question: "Která ideologie se řídí mottem: „Proč měnit něco, co funguje?“",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 1,
    explanation: "Osvědčené řešení je lepší než experiment.",
    today: "📍 **2019 Japonsko:** 30. dubna abdikoval císař Akihito jako první japonský panovník po 202 letech a 1. května ho podle staletých rituálů nástupnictví (Senso) nahradil syn Naruhito — celá výměna proběhla podle přesně stanoveného ústavního postupu, bez jediné změny fungování státu."
  },
  {
    question: "Který směr prosazuje, aby stát zasahoval do životů lidí minimálně?",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 0,
    explanation: "Co nejméně státu, co nejvíc svobody.",
    today: "📍 **1984 Nový Zéland:** Ministr financí Roger Douglas prosadil tzv. Rogernomics — během několika měsíců nechal měnu volně plavat, zrušil dovozní cla a kvóty a odboural zemědělské dotace, které do té doby tvořily až 40 % příjmů farmářů."
  },
  {
    question: "Pro kterou z těchto ideologií je klíčová pomoc chudším?",
    answers: ["Liberalismus", "Konzervatismus", "Socialismus"],
    correct: 2,
    explanation: "Sociální spravedlnost pro všechny.",
    today: "📍 **1933 Dánsko:** Kanslergadská dohoda z 30. ledna spojila sociální demokraty se sociálními liberály a zavedla ucelený systém nemocenského a nezaměstnaneckého pojištění financovaného z veřejných zdrojů — základ toho, co je dnes známé jako dánský sociální stát."
  },
  {

/* ===== Diagnostika ideologií ===== */
const IDEOLOGY_NAMES = ["Liberalismus", "Konzervatismus", "Socialismus"];
const IDEOLOGY_TRAITS = [
  "důraz na individuální svobodu a osobní odpovědnost",
  "důraz na tradici, stabilitu a opatrnost vůči změnám",
  "důraz na rovnost, solidaritu a sociální jistoty"
];
// součet otázek podle ideologie (fixní, nezávislé na průběhu kvízu)
const ideologyTotals = [0, 0, 0];
questions.forEach(q => ideologyTotals[q.correct]++);

/* ===== Stav kvízu ===== */
let currentQuestion = 0;
let score = 0;
let correctCount = 0;
let streak = 0;
let bestStreak = parseInt(localStorage.getItem('bestStreak')) || 0;
let selectedAnswers = [];
let bestScore = parseInt(localStorage.getItem('bestScore')) || 0;
let answered = false;
let lastCorrectIndex = null;
let ideologyCorrect = [0, 0, 0];
let confusionMatrix = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];

/* ===== Bodování (Educandy styl) ===== */
const BASE_POINTS = 10;
const STREAK_BONUS_STEP = 5; // bonus za každý plný krok série nad 2
function streakMultiplierBonus(currentStreak) {
  // od 3. správné odpovědi v řadě přidáváme bonus, který roste s délkou série
  if (currentStreak < 3) return 0;
  return (currentStreak - 2) * STREAK_BONUS_STEP;
}
function showPointsPopup(text, cls) {
  const el = document.createElement('div');
  el.className = 'points-popup ' + cls;
  el.textContent = text;
  pointsPopupHost.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function bumpScoreBadge() {
  scoreBadge.classList.remove('bump');
  void scoreBadge.offsetWidth;
  scoreBadge.classList.add('bump');
  setTimeout(() => scoreBadge.classList.remove('bump'), 250);
}
function maybeShowStreakToast(currentStreak) {
  if (currentStreak >= 3) {
    streakToastText.textContent = `Série ${currentStreak}! 🔥`;
    streakToast.classList.add('show');
    clearTimeout(maybeShowStreakToast._t);
    maybeShowStreakToast._t = setTimeout(() => streakToast.classList.remove('show'), 1300);
  }
}

/* ===== DOM elementy ===== */
const startScreen = document.getElementById('startScreen');
const quizScreen = document.getElementById('quizScreen');
const resultsScreen = document.getElementById('resultsScreen');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const highScoreBtn = document.getElementById('highScoreBtn');
const questionText = document.getElementById('questionText');
const answersEl = document.getElementById('answers');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const currentScoreEl = document.getElementById('currentScore');
const scoreBadge = document.getElementById('scoreBadge');
const streakToast = document.getElementById('streakToast');
const streakToastText = document.getElementById('streakToastText');
const pointsPopupHost = document.getElementById('pointsPopupHost');
const finalScoreEl = document.getElementById('finalScore');
const scoreDetailEl = document.getElementById('scoreDetail');
const recordBadge = document.getElementById('recordBadge');
const highScoreDisplay = document.getElementById('highScoreDisplay');
const bestScoreValue = document.getElementById('bestScoreValue');
const submitExit = document.getElementById('submitExit');
const feedbackBox = document.getElementById('feedbackBox');
const feedbackVerdict = document.getElementById('feedbackVerdict');
const feedbackWorld = document.getElementById('feedbackWorld');
const continueBtn = document.getElementById('continueBtn');

/* ===== Inicializace ===== */

/* ===== Funkce ===== */
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Převod **tučně** na <strong> pro text příkladu ze světa
function formatBold(str) {
  return str.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
}

function startQuiz() {
  currentQuestion = 0;
  score = 0;
  correctCount = 0;
  streak = 0;
  selectedAnswers = [];
  answered = false;
  lastCorrectIndex = null;
  feedbackBox.style.display = 'none';
  ideologyCorrect = [0, 0, 0];
  confusionMatrix = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
  // Zobraz header při spuštění kvízu
  document.querySelector('.header').style.display = 'flex';
  startScreen.style.display = 'none';
  quizScreen.style.display = 'block';
  resultsScreen.style.display = 'none';
  showQuestion();
}

function showQuestion() {
  const q = questions[currentQuestion];
  questionText.textContent = q.question;
  currentScoreEl.textContent = score;
  feedbackBox.style.display = 'none';

  // Aktualizace progress baru
  const progress = ((currentQuestion + 1) / questions.length) * 100;
  progressFill.style.width = progress + '%';
  progressLabel.textContent = `${currentQuestion + 1} z ${questions.length}`;

  // Zamíchání odpovědí
  const shuffled = shuffle(q.answers);
  // Najdeme správnou odpověď v novém pořadí
  const correctIndex = shuffled.indexOf(q.answers[q.correct]);
  lastCorrectIndex = correctIndex;

  answersEl.innerHTML = '';
  shuffled.forEach((answer, index) => {
    const btn = document.createElement('button');
    btn.className = 'answer-btn';
    btn.innerHTML = `
      <span class="answer-letter">${String.fromCharCode(65 + index)}</span>
      <span>${answer}</span>
    `;
    btn.dataset.correct = (index === correctIndex);
    btn.dataset.ideology = IDEOLOGY_NAMES.indexOf(answer);
    btn.addEventListener('click', () => selectAnswer(btn));
    answersEl.appendChild(btn);
  });
}

function selectAnswer(btn) {
  if (answered) return;
  answered = true;

  const allBtns = answersEl.querySelectorAll('.answer-btn');
  allBtns.forEach(b => b.disabled = true);

  const isCorrect = btn.dataset.correct === 'true';
  const correctIdeology = questions[currentQuestion].correct;
  const chosenIdeology = parseInt(btn.dataset.ideology);

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    streak++;
    const bonus = streakMultiplierBonus(streak);
    const gained = BASE_POINTS + bonus;
    score += gained;
    currentScoreEl.textContent = score;
    bumpScoreBadge();
    showPointsPopup(bonus > 0 ? `+${gained} (série!)` : `+${gained}`, bonus > 0 ? 'bonus' : 'good');
    maybeShowStreakToast(streak);
    if (streak > bestStreak) {
      bestStreak = streak;
      localStorage.setItem('bestStreak', bestStreak);
    }
    ideologyCorrect[correctIdeology]++;
  } else {
    btn.classList.add('wrong');
    // Označ správnou odpověď
    allBtns[lastCorrectIndex].classList.add('correct');
    confusionMatrix[correctIdeology][chosenIdeology]++;
    streak = 0;
  }

  selectedAnswers[currentQuestion] = isCorrect;

  // Zpětná vazba: krátké heslo + reálný příklad ze světa, pokračování na klik
  const q = questions[currentQuestion];
  feedbackVerdict.textContent = (isCorrect ? '✅ Správně — ' : '❌ Špatně — ') + q.explanation;
  feedbackVerdict.className = 'feedback-verdict ' + (isCorrect ? 'is-correct' : 'is-wrong');
  feedbackWorld.innerHTML = formatBold(q.today);
  feedbackBox.style.display = 'block';
  continueBtn.textContent = (currentQuestion < questions.length - 1) ? 'Pokračovat →' : 'Zobrazit výsledky →';
  continueBtn.onclick = () => nextQuestion();
}

function nextQuestion() {
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    answered = false;
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  quizScreen.style.display = 'none';
  resultsScreen.style.display = 'block';

  const percentage = Math.round((correctCount / questions.length) * 100);
  finalScoreEl.textContent = `${score} b.`;
  scoreDetailEl.innerHTML = `
    Správně jsi odpověděl/a na <strong>${correctCount}</strong> z <strong>${questions.length}</strong> otázek
    (${percentage}%) · nejdelší série: <strong>${bestStreak}🔥</strong>
  `;

  // Rekord?
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('bestScore', bestScore);
    recordBadge.style.display = 'block';
  } else {
    recordBadge.style.display = 'none';
  }

  // Zobraz nejlepší skóre
  highScoreDisplay.style.display = 'block';
  bestScoreValue.textContent = bestScore;

  // Diagnostická formativní zpětná vazba
  document.getElementById('diagnosticBox').innerHTML = generateDiagnosticFeedback();
}

function generateDiagnosticFeedback() {
  const percents = ideologyTotals.map((total, i) =>
    total ? Math.round((ideologyCorrect[i] / total) * 100) : null
  );
  const validPercents = percents.filter(p => p !== null);
  const minPercent = Math.min(...validPercents);
  const maxPercent = Math.max(...validPercents);
  const overallPercent = Math.round((correctCount / questions.length) * 100);
  const weakestIdx = percents.indexOf(minPercent);

  // Nejsilnější slabina: většinou u jedné ideologie
  if (minPercent < 50) {
    const weakestName = IDEOLOGY_NAMES[weakestIdx];
    return `Nejslabší: <strong>${weakestName}</strong> (${minPercent} %). Zopakuj si: ${IDEOLOGY_TRAITS[weakestIdx]}.`;
  }

  // Vyrovnané, ale celkově nízké
  if (maxPercent - minPercent <= 20 && overallPercent < 70) {
    return `Váháš mezi všemi třemi. Zopakuj si osu: <strong>svoboda</strong> (liberalismus), <strong>tradice</strong> (konzervatismus), <strong>rovnost</strong> (socialismus).`;
  }

  // Silný výkon
  if (overallPercent >= 90) {
    return `Výborně — spolehlivě rozlišuješ všechny tři ideologie.`;
  }

  // Dobrý výkon, jen doladit rozdíly
  const strongestIdx = percents.indexOf(maxPercent);
  return `Nejjistější ti jde <strong>${IDEOLOGY_NAMES[strongestIdx]}</strong> (${maxPercent} %). Zaměř se na jemný rozdíl u zbylých dvou.`;
}

function showHighScore() {
  alert(`Tvé nejlepší skóre: ${bestScore} bodů · nejdelší série: ${bestStreak}🔥`);
}

function submitExitTicket() {
  const rating = document.querySelector('input[name="rating"]:checked');
  const comment = document.getElementById('exitComment').value.trim();

  if (!rating) {
    alert('Prosím, vyber hodnocení (1–5).');
    return;
  }

  const ratingValue = parseInt(rating.value);
  const messages = {
    1: '1/5 · Ještě mi to není jasné.',
    2: '2/5 · Potřebuju to procvičit.',
    3: '3/5 · Zvládám, ale jsou tam mezery.',
    4: '4/5 · Skoro vše rozumím.',
    5: '5/5 · Rozumím výborně!'
  };

  alert(
    `Děkujeme za odezvu! (${ratingValue}/5) · ${messages[ratingValue]}` +
    (comment ? `\n\nKomentář: ${comment}` : '')
  );

  // Reset formuláře
  document.querySelector('input[name="rating"]').checked = false;
  document.getElementById('exitComment').value = '';
}

/* ===== Particles ===== */
function createParticles() {
  const container = document.createElement('div');
  container.className = 'particles';
  document.body.appendChild(container);

  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.opacity = (Math.random() * 0.1 + 0.1).toString();
    container.appendChild(p);
  }
}
createParticles();

/* ===== Event listeners ===== */
startBtn.addEventListener('click', startQuiz);
restartBtn.addEventListener('click', startQuiz);
if (highScoreBtn) {
  highScoreBtn.addEventListener('click', showHighScore);
}
submitExit.addEventListener('click', submitExitTicket);
</script>
